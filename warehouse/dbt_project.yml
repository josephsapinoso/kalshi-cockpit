name: "kalshi_cockpit"
version: "0.1.0"
config-version: 2

profile: "kalshi_cockpit"

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # The live gate's floor. Marts refuse to offer a verdict below it.
  min_scored_recommendations: 300

  # Normal-approximation validity: at least this many expected outcomes on each
  # side before a cell is allowed to speak. A two-market cell once produced a
  # 74-point "finding" that passed a significance test.
  min_expected_per_side: 5

  # Above this gap, no fee explains edge and money disagreeing. The entry fee
  # peaks at 1.75c/contract, so 3c is the right side of the line.
  edge_money_tolerance_cents: 3.0

models:
  kalshi_cockpit:
    staging:
      +materialized: view
    marts:
      +materialized: table
