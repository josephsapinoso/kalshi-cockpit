# Men's college basketball team-name overrides.
#
# See americanfootball_nfl.yaml for the rules. First derived 2026-10-30 on
# n = 7 book fixtures (Miami (FL) only). RE-DERIVED 2026-11-12 (#401) by
# `scripts/capture_team_names.py --league ncaab` against 177 Kalshi
# `KXNCAAMBGAME` events and 62 Odds API fixtures. With no aliases: 52 linked,
# 10 refused on names. With this file: 61 linked, 1 refused (Tennessee St. vs
# Tennessee); 62 linked, 0 refused since #434 (2026-11-13). 97 had no book fixture at their kickoff, 18 had no fixture
# at that kickoff sharing either side (not carried). Every pair below was read
# off that run's output, both halves; none is from memory. A team absent from
# this file is still not proof it needs none -- 62 fixtures is two weeknight evenings.
#
# Format:  <kalshi name>: <sportsbook name>
# The VALUE must be the book's full string including the mascot.

teams:
  # Parenthesised disambiguation leaves a stray token: "Miami (FL)" becomes
  # "miami fl", and "fl" is not a prefix of "hurricanes". Same entry, same
  # reason, as americanfootball_ncaaf.yaml.
  Miami (FL): Miami Hurricanes
  # Read off the 2026-11-12 capture. Each is a school whose book name shares
  # no leading token with Kalshi's: an abbreviation (CSU, GW, Mt., SE, UL), a
  # dropped prefix (Purdue Fort Wayne), or a parenthesised state.
  Cal State Bakersfield: CSU Bakersfield Roadrunners
  Loyola Maryland: Loyola (MD) Greyhounds
  Purdue Fort Wayne: Fort Wayne Mastodons
  Southern University: Southern Jaguars
  George Washington: GW Revolutionaries
  Mount St. Mary's: Mt. St. Mary's Mountaineers
  Southeast Missouri St.: SE Missouri St Redhawks
  Louisiana-Monroe: UL Monroe Warhawks
  # "Tennessee" is a token prefix of three book names (Tennessee St Tigers,
  # Tennessee Tech Golden Eagles, Tennessee Volunteers), so Tennessee St. at
  # Tennessee had no bijection. Fixed 2026-11-13 (#434) by making an override
  # EXCLUSIVE in `linker._matches`: this entry pins Kalshi's bare "Tennessee"
  # to the Volunteers and nothing else. Read off the 2026-11-12 capture.
  Tennessee: Tennessee Volunteers
