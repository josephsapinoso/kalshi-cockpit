# Push notification secrets to Fly, triggered by hand.
#
# `flyctl secrets set` is the last step in this project that genuinely needed a
# laptop. Deployment already moved to a "Run workflow" button; this does the
# same for the one secret that has to be set after it.
#
# Three deliberate limits, because this workflow writes to the instance holding
# real credentials:
#
#   - **Values never travel as workflow inputs.** A `workflow_dispatch` input is
#     stored in the run's metadata in plaintext and is readable from the UI and
#     the API forever. A webhook URL there would be a credential in a log, which
#     is the exact failure `backend/logging_setup.py` exists to prevent. Values
#     come from repository secrets, which GitHub masks.
#   - **Notification secrets only.** This cannot touch KALSHI_PRIVATE_KEY,
#     KALSHI_API_KEY, APP_AUTH_TOKEN or ODDS_API_KEY. Those live in Fly and
#     nowhere else; routing them through GitHub would double the number of
#     vaults that can leak them, to save a step nobody takes twice.
#   - **Live requires typing the app name**, exactly as the deploy workflow
#     does. A dropdown mis-tap on a phone is a plausible way to write to the
#     money instance by accident; typing its name is not.
#
# Setting a secret restarts the machines, which is required rather than
# incidental: the loop reads DISCORD_WEBHOOK_URL at startup, so a staged secret
# would sit there configured and inert.
#
# Required repository secrets: FLY_API_TOKEN, and at least one of
# DISCORD_WEBHOOK_URL / (DISCORD_BOT_TOKEN + DISCORD_CHANNEL_ID).

name: Set notification secrets

on:
  workflow_dispatch:
    inputs:
      instance:
        description: "Which instance"
        required: true
        default: live
        type: choice
        options: [live, demo]
      confirm_live:
        description: "To write to LIVE, type its app name: kalshi-cockpit"
        required: false
        default: ""
        type: string

concurrency:
  group: secrets-${{ inputs.instance }}
  cancel-in-progress: false

jobs:
  set:
    name: Set notification secrets on ${{ inputs.instance }}
    runs-on: ubuntu-latest
    steps:
      - name: Guard the live instance
        if: inputs.instance == 'live'
        run: |
          if [ "${{ inputs.confirm_live }}" != "kalshi-cockpit" ]; then
            echo "::error::Writing to live needs the app name typed into"
            echo "::error::confirm_live. Got: '${{ inputs.confirm_live }}'"
            exit 1
          fi

      - name: Refuse to configure alerting on the demo
        if: inputs.instance == 'demo'
        run: |
          echo "::error::The demo instance holds no credentials and runs no"
          echo "::error::recording loop, so it has nothing to alert about."
          echo "::error::Deliberate: a public deploy should not be one"
          echo "::error::workflow run away from holding a channel credential."
          exit 1

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Set them
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
        run: |
          set -euo pipefail

          # Written to flyctl's STDIN, never to its argv. Arguments are visible
          # in the process table; a heredoc is not. GitHub masks these values in
          # the log either way, but masking is a display rule and this is not.
          payload=""
          names=""
          if [ -n "${DISCORD_WEBHOOK_URL}" ]; then
            payload="${payload}DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}"$'\n'
            names="${names} DISCORD_WEBHOOK_URL"
          fi
          if [ -n "${DISCORD_BOT_TOKEN}" ] && [ -n "${DISCORD_CHANNEL_ID}" ]; then
            payload="${payload}DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}"$'\n'
            payload="${payload}DISCORD_CHANNEL_ID=${DISCORD_CHANNEL_ID}"$'\n'
            names="${names} DISCORD_BOT_TOKEN DISCORD_CHANNEL_ID"
          fi

          if [ -z "${payload}" ]; then
            echo "::error::No notification secret is set on this repository."
            echo "::error::Add DISCORD_WEBHOOK_URL under Settings -> Secrets"
            echo "::error::and variables -> Actions, then run this again."
            echo "::error::Nothing was changed on Fly."
            exit 1
          fi

          # Only the NAMES are echoed. Never the values.
          echo "setting:${names}"
          printf '%s' "${payload}" | flyctl secrets import --app kalshi-cockpit

      - name: Verify it took effect
        run: |
          set -euo pipefail
          # "I set the secret" and "the secret is in effect" are different
          # facts, and the failure mode of the second is silence -- which is
          # also what a working alerter looks like on a quiet night. The app
          # reports a boolean, never the value.
          for attempt in $(seq 1 30); do
            body="$(curl -fsS https://kalshi-cockpit.fly.dev/api/health || true)"
            case "${body}" in
              *'"notifications_configured":true'*)
                echo "notifications_configured=true after ${attempt} attempt(s)"
                exit 0
                ;;
            esac
            sleep 10
          done
          echo "::error::The app restarted but still reports"
          echo "::error::notifications_configured=false. The secret is set on"
          echo "::error::Fly and the process is not seeing it -- check that the"
          echo "::error::machine actually restarted (Ops -> machines)."
          exit 1
