# Tests, warehouse build, frontend build, and a secret scan on every push.
#
# This repo is intended to go public and the live instance holds real money, so
# the secret scan is not a formality -- it is the last thing standing between a
# private key and a public commit.
#
# Which makes the way it broke worth stating. From 2026-08-07 19:17Z the secret
# scan failed on **every** push -- 36 in a row -- because its private-key grep
# matched the phrase rather than the material, and two files legitimately
# contain the phrase: `docker/entrypoint.sh` validating a decoded key's format,
# and `tests/test_logging_redaction.py` proving the redactor strips a PEM block.
# A check that is always red is not a check. Nobody can tell the run that found
# a real key from the 36 that found a comment about one, and CI red becomes the
# resting state rather than a signal. See `tasks/inbox/ci.md`.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Agents push in bursts -- the gaps between the last 25 pushes ran 1.0-1.4
# minutes against a CI that takes ~2, so runs were routinely obsolete before
# they finished and every one of them billed in full. GitHub rounds each job up
# to a whole minute, so a superseded run costs 3 minutes no matter how early it
# is cancelled.
#
# `github.head_ref || github.ref` collapses the push run and the pull_request
# run for one branch into a single group. Every run to date is a push and none
# is a pull_request, so line 21 never fires today -- but left unscoped, CI
# silently doubles the moment anyone opens a PR.
#
# Deploy and secrets deliberately set `cancel-in-progress: false` instead. Do
# not copy this block there: a half-finished `flyctl deploy` must queue, never
# be killed.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests + warehouse
    runs-on: ubuntu-latest
    # No job in any workflow had a timeout, so all inherited GitHub's 6-hour
    # default. One hung job is 360 billable minutes -- a fifth of the monthly
    # allowance. Ceilings are set well above the longest run ever observed
    # (6.3 min, Deploy demo); they are a runaway backstop, not a target.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # An INDEPENDENT vulnerability check, and "independent" is the whole
      # point of it. GitHub's dependabot is **permanently blind to
      # `cryptography` on this repo** -- a monitoring failure, not a stale
      # reading. The dependency graph holds no resolved version for the
      # package: the SBOM carries two `cryptography` entries and both have an
      # empty `versionInfo`, and an advisory cannot match a node with no
      # version. So alert #15 reports `fixed` while `requirements.txt` still
      # pins `cryptography~=44.0`, resolving to 44.0.3, squarely inside the
      # range GHSA-jwv3-5hgf-82ww names. A stale alert self-corrects on the
      # next scan; a package with no resolved version **never matches an
      # advisory again**, including advisories not yet published. The
      # session-start dependabot query in `tasks/NEXT.md` therefore cannot
      # catch the next one, and this step is the only thing that closes the
      # hole.
      #
      # **It audits `requirements.txt`, and that file is the ship/no-ship
      # boundary.** The Dockerfile's stage 2 installs `requirements.txt`
      # alone, so it is the only file whose contents reach the live instance
      # holding real money. Dev/test dependencies are deliberately OUT: they
      # do not ship, so a finding there cannot reach the live instance, and
      # `requirements-dev.txt` begins with `-r requirements.txt`, which means
      # auditing it re-reports every shipping finding with nothing in the
      # output marking which is which. Naming the shipped file here is how a
      # reader tells the two apart -- anything this step reports is exposure.
      # Check dev deps by hand with `pip-audit -r requirements-dev.txt` and
      # read only the rows this step does not already show. The one dev-only
      # finding on 2026-09-08 was pytest 8.4.2, PYSEC-2026-1845, fixed 9.0.3.
      #
      # Placed before the lint and the suite so a vulnerable dependency fails
      # in about a minute rather than after the 15-minute cap.
      #
      # `--strict` fails the audit if dependency *collection* fails on any
      # dependency, instead of skipping it quietly. That is precisely the
      # failure mode dependabot is sitting in -- a package nothing can resolve
      # is a package no advisory can ever match -- so it has to be red here,
      # not silent. There is no `continue-on-error` and no `|| true`: a guard
      # that cannot fail is not a guard.
      #
      # --------------------------------------------------------------------
      # THE IGNORE LIST BELOW IS A RECORD OF OPEN DECISIONS, NOT A
      # SUPPRESSION. Read this before adding to it.
      # --------------------------------------------------------------------
      # Every advisory outstanding on 2026-09-08 is listed individually, by
      # ID, with what it is, what fixes it, and why it is not fixed today.
      # That resolves a real tension between two rules, both load-bearing:
      #
      #   "A guard that cannot fail is not a guard" -- so nothing here touches
      #   the exit code, and `--strict` stays.
      #
      #   "A check that is always red is not a check" -- this file's own
      #   header, paid for with 36 consecutive red pushes where nobody could
      #   tell the run that found a real key from the ones that found a
      #   comment about one. A step committed red on push one recreates
      #   exactly that, and a red-at-rest gate teaches people to ignore the
      #   gate. That is the worse failure of the two.
      #
      # A per-ID list is green at rest and red on anything NEW, which is the
      # entire reason this step exists. None of these seven is made worse by
      # being listed -- they are unfixed today either way, and no step at all
      # is strictly less safe.
      #
      # RULES FOR THIS LIST. Never a wildcard, never a severity floor, never
      # an unexplained ID. An entry is DELETED the moment its bump lands; it
      # must not outlive the decision it records. Adding an eighth entry also
      # means editing `TestThePipAuditIgnoreListIsPinned` in
      # `tests/test_marts.py`, which names out loud everything being silenced
      # -- so growing this list is a deliberate act rather than the easy way
      # out of a red build at an awkward hour.
      #
      # TWO KINDS OF ENTRY, and they are not the same thing:
      #   DEFERRED FIX      the advisory applies to this pin and we have
      #                     chosen not to bump yet.
      #   KNOWN-BAD MATCH   the advisory cannot affect this deployment at all
      #                     -- the version range excludes the pin, or the
      #                     vulnerable code path does not exist here.
      # Each entry also records call-path reachability. For a DEFERRED FIX
      # that is context for how urgent the bump is; it is NOT a reason to
      # reclassify the entry, because the installed version really is
      # vulnerable and future code can reach what today's code does not.
      #
      # WHICH PATH EACH ONE IS ON, because a reader hitting a red build at 2am
      # needs this in front of them. Six are `cryptography`, which signs
      # real-money orders by RSA-PSS -- that is why the bump is Joe-gated and
      # wants a live signing test in front of a human. One is `pyarrow`, used
      # only by the SQLite -> Parquet publish step, which touches no money
      # path at all: a different decision with a different owner.
      #
      # **THE CRYPTOGRAPHY BUMP IS DONE -- 44 -> 50, on 2026-09-09.**
      # It had to be 50 and not 49: GHSA-g6cj-pr64-35w5 was introduced at
      # 44.0.0 and is not fixed until 50.0.0, so stopping at 49.0.0 would have
      # cleared dependabot alert #15 and left the PKCS#7 padding oracle
      # standing. **This step is what found that**, on its first run, against
      # an instrument that could see only one of the seven. ADR 0124.
      - name: Audit shipped dependencies (pip-audit)
        run: |
          set -euo pipefail

          IGNORE=()

          # ---- ONE ENTRY. It was seven until 2026-09-09. ---------------
          #
          # The six cryptography advisories are GONE, not silenced: the pin
          # went 44 -> 50 on Joe's explicit yes (ADR 0124), and `pip-audit`
          # against `requirements.txt` with NO ignores at all now reports
          # exactly the one entry below. Deleting an ignore the moment its
          # bump lands is the rule this list was written under, and this is
          # that rule being kept.
          #
          # GHSA-rgxp-2hwp-jwgg (PYSEC-2026-113, CVE-2026-25087)
          # KNOWN-BAD MATCH -- unreachable here, NOT a deferred fix.
          # Use-after-free in Apache Arrow C++ reading an Arrow **IPC file**
          # (explicitly not an IPC stream) with pre-buffering, where the
          # file holds variadic buffers. Affects 15.0.0 through 23.0.0;
          # fixed 23.0.1. The range does match the 19.0.1 pin, but the code
          # path does not exist here: the only pyarrow call touching a file
          # is `pq.write_table` in `backend/store/publish.py`, a Parquet
          # *write*, and a tree-wide search for `pyarrow.ipc`, `feather`,
          # `RecordBatchFileReader`, `RecordBatchStreamReader`, `open_file`,
          # `open_stream` and `pre_buffer` returns nothing outside `.venv`.
          # RE-EVALUATE if anything starts reading `.arrow` or `.feather`.
          IGNORE+=(--ignore-vuln GHSA-rgxp-2hwp-jwgg)

          pip-audit -r requirements.txt --strict --progress-spinner off \
            "${IGNORE[@]}"

      # ruff.toml selects only pyflakes + pycodestyle's error classes (59
      # rules), minus the four rule codes that already have violations this
      # lane cannot fix (see ruff.toml for the count and tasks/inbox/ci.md for
      # how it was measured). Deliberately not ruff's own default selection --
      # that finds 513 violations today, all outside this lane, and would be
      # red on the first push.
      - name: Lint (ruff)
        run: ruff check .

      - name: Tests
        run: python -m pytest -q

      # The warehouse carries the measurement guards as dbt tests, so a mart
      # that would serve a noise-level number fails the build rather than the
      # dashboard. Seeded data means this needs no credentials.
      # `--db` is explicit: `publish` otherwise reads DB_PATH from config, which
      # defaults to data/cockpit.db, while seed_demo writes data/demo.db. A
      # local dry-run of this job caught that -- in CI it would have been an
      # "unable to open database file" on a fresh checkout.
      - name: Seed and publish
        run: |
          python -m backend.seed_demo
          python -m backend.store.publish --db data/demo.db

      - name: dbt build
        working-directory: warehouse
        run: dbt build

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Belt and braces, and the two nets cover different ground. gitleaks
      # scans only the commits **in this push** (`git log -p -1` for a
      # single-commit push), so a key committed last week and still sitting in
      # the tree is invisible to it on every push after the one that added it.
      # This scans the tracked tree at HEAD, every time.
      - name: Project-specific checks
        run: |
          set -euo pipefail
          fail=0

          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is tracked. It must never be committed."
            fail=1
          fi

          # .pfx and .p12 are PKCS#12 -- a private key in a container with a
          # different extension. .gitignore refuses .pfx and says nothing about
          # .p12, and this check knew about neither, so the two disagreed about
          # what counts as a key file.
          if git ls-files | grep -Ei '\.(pem|key|p8|pkcs8|pfx|p12)$'; then
            echo "::error::A key file is tracked."
            fail=1
          fi

          # Key *material*, not the words for it. Three shapes, and between them
          # they cover how a key actually arrives in a commit:
          #
          #   own_line  a PEM header alone on its line -- a key pasted verbatim
          #             into any file, at any indentation.
          #   inline    a PEM header followed immediately by a base64 body --
          #             the .env / JSON single-line escaped form.
          #   quoted    a quote character immediately followed by a header that
          #             then ends the line -- `KEY = """-----BEGIN ...`, a key
          #             pasted straight after an opening string delimiter.
          #
          # None of them matches a header *mentioned* in source or prose, which
          # is what the two legitimate files contain. There is no path exclusion
          # any more: the old `:!*.yml` was there only to stop this workflow
          # matching itself, and it made a key pasted into
          # `warehouse/profiles.yml` -- a file that exists to hold a connection
          # -- unscannable.
          #
          # `quoted` exists because narrowing from a phrase match to a material
          # match lost a case the broken pattern used to catch: `own_line`
          # requires the header to start its line, so a key pasted after an
          # opening triple-quote was invisible to both other patterns, and the
          # body line below it is bare base64 that nothing here matches.
          #
          # **The first version of `quoted` matched the quote alone and turned
          # this step red on the next push.** `tasks/lessons.md` documents the
          # `KEY = """-----BEGIN ...` case *by reproducing it*, in a fenced
          # code block, which is the exact shape the pattern looked for. So the
          # repair for a false negative shipped a false positive onto the file
          # that explains the false negative -- the third turn of the same
          # screw, and the same 36-pushes-of-red failure one file over.
          #
          # The distinguishing feature was never the quote. It is that **the
          # next line is key material**. grep is line-oriented and cannot see
          # that, so this one case is checked two lines at a time. A quoted
          # header followed by a fence, by prose, or by nothing is a mention; a
          # quoted header followed by forty-odd characters of base64 is a key.
          own_line='^[[:space:]]*-----BEGIN( [A-Z0-9]+)* PRIVATE KEY-----[[:space:]]*$'
          inline='-----BEGIN( [A-Z0-9]+)* PRIVATE KEY-----[^A-Za-z0-9+/]{0,4}[A-Za-z0-9+/]{40,}'
          quoted='["'"'"'`]-----BEGIN( [A-Z0-9]+)* PRIVATE KEY-----[[:space:]"'"'"'`]*$'

          # Both regexes arrive as -v variables rather than as awk literals: a
          # bare `/` inside a bracket expression is a lexer hazard in some awks,
          # and interval syntax (`{40,}`) is not portable to mawk, which is what
          # ubuntu-latest ships. `length()` says the same thing everywhere.
          scan_quoted() {
            awk -v Q="$quoted" -v B='^[A-Za-z0-9+/=]+$' '
              { sub(/\r$/, "") }
              FNR == 1 { prev = "" }          # never pair the end of one file
                                              # with the start of the next
              prev != "" && $0 ~ B && length($0) >= 40 {
                printf "%s:%d: %s\n", FILENAME, FNR - 1, prev
                found = 1
              }
              { prev = ($0 ~ Q) ? $0 : "" }
              END { exit found ? 0 : 1 }
            ' "$@"
          }

          # The patterns are exercised against known answers before they are
          # trusted against the tree. A regex that has quietly stopped matching
          # anything passes the real check forever and looks exactly like a
          # clean repo -- which is the failure this step just spent 36 pushes
          # demonstrating in the other direction. The canary body is random
          # bytes, never a key.
          tmp="$(mktemp -d)"
          body="$(head -c 48 /dev/urandom | base64 | tr -d '\n')"
          printf -- '-----BEGIN RSA PRIVATE KEY-----\n%s\n-----END RSA PRIVATE KEY-----\n' \
            "$body" > "$tmp/pasted"
          printf -- 'KALSHI_PRIVATE_KEY="-----BEGIN EC PRIVATE KEY-----\\n%s"\n' \
            "$body" > "$tmp/escaped"
          printf -- 'KEY = """-----BEGIN RSA PRIVATE KEY-----\n%s\n' \
            "$body" > "$tmp/after_quote"
          printf -- 'if grep -q -- "-----BEGIN OPENSSH PRIVATE KEY-----" "$f"; then\n' \
            > "$tmp/mentioned"
          printf -- 'The file must start with -----BEGIN RSA PRIVATE KEY-----\n' \
            > "$tmp/prose"
          # The shape that turned this red: the quoted case written *about*
          # rather than committed. Same first line as `after_quote`, and the
          # next line is a code fence instead of a body.
          printf -- '```\nKEY = """-----BEGIN RSA PRIVATE KEY-----\n```\n' \
            > "$tmp/quoted_in_prose"

          # `-e` throughout, never a bare pattern: `$inline` begins with `---`
          # and grep reads that as options. The canary found this on the first
          # local run of this step, which is the whole argument for having one.
          if ! grep -qE -e "$own_line" "$tmp/pasted"; then
            echo "::error::the pasted-key pattern no longer matches a pasted key."
            echo "::error::This step cannot detect anything. Fix it before merging."
            fail=1
          fi
          if ! grep -qE -e "$inline" "$tmp/escaped"; then
            echo "::error::the escaped-key pattern no longer matches an escaped key."
            echo "::error::This step cannot detect anything. Fix it before merging."
            fail=1
          fi
          if ! scan_quoted "$tmp/after_quote" >/dev/null; then
            echo "::error::a key pasted after an opening quote is not matched."
            echo "::error::This is the case the phrase-matching pattern used to"
            echo "::error::catch, and it is how a key reaches a source file."
            fail=1
          fi
          for clean in mentioned prose quoted_in_prose; do
            if grep -qE -e "$own_line" -e "$inline" "$tmp/$clean" \
               || scan_quoted "$tmp/$clean" >/dev/null; then
              echo "::error::the patterns match a header named in $clean again."
              echo "::error::That is the false positive that made this step red on"
              echo "::error::36 consecutive pushes. Match the material, not the phrase."
              fail=1
            fi
          done
          rm -rf "$tmp"

          # Tested against the **real** files, not only against synthetic ones.
          # All three exist because of key hygiene -- one validates a decoded
          # key's format, one proves the redactor strips a PEM block, and one
          # is the lesson written after this step spent 36 pushes red. They are
          # the exact shapes this step must not fire on, so a future widening
          # of the patterns fails loudly here instead of turning CI red again.
          #
          # There is still no path exclusion. `tasks/lessons.md` is listed
          # because it must stay *scannable*: it is prose about leaked keys, so
          # it is a genuinely plausible place for one to be pasted, and
          # excluding it would make the most likely accident the least visible.
          for legit in docker/entrypoint.sh tests/test_logging_redaction.py \
                       tasks/lessons.md; do
            if grep -qE -e "$own_line" -e "$inline" "$legit" \
               || scan_quoted "$legit" >/dev/null; then
              echo "::error::$legit matches. It contains the words for a key, not"
              echo "::error::a key. Narrow the patterns rather than excluding the file."
              fail=1
            fi
          done

          if git grep -nE -e "$own_line" -e "$inline"; then
            echo "::error::Private key material found in the working tree."
            echo "::error::If this key was ever real, ROTATE IT -- it is compromised."
            fail=1
          fi

          # The two-line case, over the files that carry a quoted header at all
          # -- so awk never opens the whole tree, and never opens a binary.
          # `-z` because a tracked path may contain a space.
          quoted_candidates=()
          while IFS= read -r -d '' candidate; do
            quoted_candidates+=("$candidate")
          done < <(git grep -lzE -e "$quoted" || true)
          if [ ${#quoted_candidates[@]} -gt 0 ] \
             && scan_quoted "${quoted_candidates[@]}"; then
            echo "::error::A private key follows an opening quote in the tree."
            echo "::error::If this key was ever real, ROTATE IT -- it is compromised."
            fail=1
          fi

          # What this does not establish: it reads the tree at HEAD, so a key
          # that was committed and later deleted is gone from here and lives on
          # in history. Only a full-history scan finds that, and gitleaks above
          # is scoped to the push. If a key is ever suspected, rotate first and
          # run `gitleaks detect --log-opts=--all` by hand second.
          exit $fail
