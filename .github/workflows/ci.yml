# Tests, warehouse build, frontend build, and a secret scan on every push.
#
# This repo is intended to go public and the live instance holds real money, so
# the secret scan is not a formality -- it is the last thing standing between a
# private key and a public commit.
#
# Which makes the way it broke worth stating. From 2026-08-07 19:17Z the secret
# scan failed on **every** push -- 36 in a row -- because its private-key grep
# matched the phrase rather than the material, and two files legitimately
# contain the phrase: `docker/entrypoint.sh` validating a decoded key's format,
# and `tests/test_logging_redaction.py` proving the redactor strips a PEM block.
# A check that is always red is not a check. Nobody can tell the run that found
# a real key from the 36 that found a comment about one, and CI red becomes the
# resting state rather than a signal. See `tasks/inbox/ci.md`.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests + warehouse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # ruff.toml selects only pyflakes + pycodestyle's error classes (59
      # rules), minus the four rule codes that already have violations this
      # lane cannot fix (see ruff.toml for the count and tasks/inbox/ci.md for
      # how it was measured). Deliberately not ruff's own default selection --
      # that finds 513 violations today, all outside this lane, and would be
      # red on the first push.
      - name: Lint (ruff)
        run: ruff check .

      - name: Tests
        run: python -m pytest -q

      # The warehouse carries the measurement guards as dbt tests, so a mart
      # that would serve a noise-level number fails the build rather than the
      # dashboard. Seeded data means this needs no credentials.
      # `--db` is explicit: `publish` otherwise reads DB_PATH from config, which
      # defaults to data/cockpit.db, while seed_demo writes data/demo.db. A
      # local dry-run of this job caught that -- in CI it would have been an
      # "unable to open database file" on a fresh checkout.
      - name: Seed and publish
        run: |
          python -m backend.seed_demo
          python -m backend.store.publish --db data/demo.db

      - name: dbt build
        working-directory: warehouse
        run: dbt build

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Belt and braces, and the two nets cover different ground. gitleaks
      # scans only the commits **in this push** (`git log -p -1` for a
      # single-commit push), so a key committed last week and still sitting in
      # the tree is invisible to it on every push after the one that added it.
      # This scans the tracked tree at HEAD, every time.
      - name: Project-specific checks
        run: |
          set -euo pipefail
          fail=0

          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is tracked. It must never be committed."
            fail=1
          fi

          # .pfx and .p12 are PKCS#12 -- a private key in a container with a
          # different extension. .gitignore refuses .pfx and says nothing about
          # .p12, and this check knew about neither, so the two disagreed about
          # what counts as a key file.
          if git ls-files | grep -Ei '\.(pem|key|p8|pkcs8|pfx|p12)$'; then
            echo "::error::A key file is tracked."
            fail=1
          fi

          # Key *material*, not the words for it. Three shapes, and between them
          # they cover how a key actually arrives in a commit:
          #
          #   own_line  a PEM header alone on its line -- a key pasted verbatim
          #             into any file, at any indentation.
          #   inline    a PEM header followed immediately by a base64 body --
          #             the .env / JSON single-line escaped form.
          #   quoted    a quote character immediately followed by a header that
          #             then ends the line -- `KEY = """-----BEGIN ...`, a key
          #             pasted straight after an opening string delimiter.
          #
          # None of them matches a header *mentioned* in source or prose, which
          # is what the two legitimate files contain. There is no path exclusion
          # any more: the old `:!*.yml` was there only to stop this workflow
          # matching itself, and it made a key pasted into
          # `warehouse/profiles.yml` -- a file that exists to hold a connection
          # -- unscannable.
          #
          # `quoted` exists because narrowing from a phrase match to a material
          # match lost a case the broken pattern used to catch. `own_line`
          # requires the header to start its line, so a key pasted after an
          # opening triple-quote was invisible to both other patterns, and the
          # body line below it is bare base64 that nothing here matches. The
          # distinguishing feature is the quote *immediately* before the header:
          # prose says "must start with -----BEGIN RSA PRIVATE KEY-----" with a
          # space there, and stays clean.
          own_line='^[[:space:]]*-----BEGIN( [A-Z0-9]+)* PRIVATE KEY-----[[:space:]]*$'
          inline='-----BEGIN( [A-Z0-9]+)* PRIVATE KEY-----[^A-Za-z0-9+/]{0,4}[A-Za-z0-9+/]{40,}'
          quoted='["'"'"'`]-----BEGIN( [A-Z0-9]+)* PRIVATE KEY-----[[:space:]"'"'"'`]*$'

          # The patterns are exercised against known answers before they are
          # trusted against the tree. A regex that has quietly stopped matching
          # anything passes the real check forever and looks exactly like a
          # clean repo -- which is the failure this step just spent 36 pushes
          # demonstrating in the other direction. The canary body is random
          # bytes, never a key.
          tmp="$(mktemp -d)"
          body="$(head -c 48 /dev/urandom | base64 | tr -d '\n')"
          printf -- '-----BEGIN RSA PRIVATE KEY-----\n%s\n-----END RSA PRIVATE KEY-----\n' \
            "$body" > "$tmp/pasted"
          printf -- 'KALSHI_PRIVATE_KEY="-----BEGIN EC PRIVATE KEY-----\\n%s"\n' \
            "$body" > "$tmp/escaped"
          printf -- 'KEY = """-----BEGIN RSA PRIVATE KEY-----\n%s\n' \
            "$body" > "$tmp/after_quote"
          printf -- 'if grep -q -- "-----BEGIN OPENSSH PRIVATE KEY-----" "$f"; then\n' \
            > "$tmp/mentioned"
          printf -- 'The file must start with -----BEGIN RSA PRIVATE KEY-----\n' \
            > "$tmp/prose"

          # `-e` throughout, never a bare pattern: `$inline` begins with `---`
          # and grep reads that as options. The canary found this on the first
          # local run of this step, which is the whole argument for having one.
          if ! grep -qE -e "$own_line" "$tmp/pasted"; then
            echo "::error::the pasted-key pattern no longer matches a pasted key."
            echo "::error::This step cannot detect anything. Fix it before merging."
            fail=1
          fi
          if ! grep -qE -e "$inline" "$tmp/escaped"; then
            echo "::error::the escaped-key pattern no longer matches an escaped key."
            echo "::error::This step cannot detect anything. Fix it before merging."
            fail=1
          fi
          if ! grep -qE -e "$quoted" "$tmp/after_quote"; then
            echo "::error::a key pasted after an opening quote is not matched."
            echo "::error::This is the case the phrase-matching pattern used to"
            echo "::error::catch, and it is how a key reaches a source file."
            fail=1
          fi
          for clean in mentioned prose; do
            if grep -qE -e "$own_line" -e "$inline" -e "$quoted" "$tmp/$clean"; then
              echo "::error::the patterns match a header named in $clean again."
              echo "::error::That is the false positive that made this step red on"
              echo "::error::36 consecutive pushes. Match the material, not the phrase."
              fail=1
            fi
          done
          rm -rf "$tmp"

          # The exclusions are tested against the real files, not only against
          # synthetic ones. These two exist *because* of key hygiene -- one
          # validates a decoded key's format, one proves the redactor strips a
          # PEM block -- so they are the exact shape this step must not fire on,
          # and asserting it here means a future widening of the patterns fails
          # loudly instead of turning CI red again.
          for legit in docker/entrypoint.sh tests/test_logging_redaction.py; do
            if grep -qE -e "$own_line" -e "$inline" -e "$quoted" "$legit"; then
              echo "::error::$legit matches. It contains the words for a key, not"
              echo "::error::a key. Narrow the patterns rather than excluding the file."
              fail=1
            fi
          done

          if git grep -nE -e "$own_line" -e "$inline" -e "$quoted"; then
            echo "::error::Private key material found in the working tree."
            echo "::error::If this key was ever real, ROTATE IT -- it is compromised."
            fail=1
          fi

          # What this does not establish: it reads the tree at HEAD, so a key
          # that was committed and later deleted is gone from here and lives on
          # in history. Only a full-history scan finds that, and gitleaks above
          # is scoped to the push. If a key is ever suspected, rotate first and
          # run `gitleaks detect --log-opts=--all` by hand second.
          exit $fail
