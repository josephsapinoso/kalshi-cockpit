# #118's registered reading, taken by a scheduler because nobody is awake for it.
#
# The pre-registration (docs/measurements/2026-09-21-preregistration-
# unattended-scouting-first-reading.md, section 2) fixes T1 as a 55-minute
# window, 2026-09-23 09:00-09:55Z -- 02:00 PDT on Joe's clock -- with n = 1
# and one slip, and the slip lands at 02:00 PDT again. No interactive session
# survives to that hour. This workflow is one of two arms that take the read
# unattended (the other is a Windows scheduled task on the laptop, same
# script); Amendment 1 of the registration says which of the several reads
# is T1.
#
# **Dated and self-expiring.** Every cron below names 23 September. It fires
# on that day of 2026 and, if this file is still here, on the same day next
# year -- so the session that writes the result doc DELETES THIS FILE and the
# scheduled task in the same commit. That is a Done-when line on the ticket
# that opened it, not a courtesy.
#
# **Deliberately READ-ONLY.** It checks out the tree and runs
# `scripts/measure_118_trip.sh`, whose four venue-side commands are
# committed scripts invoked by path over `flyctl ssh console`
# (fetch_live_route.py cannot express a write; the three QueryDefs are
# cost=CHEAP). Nothing here deploys, scales, restarts, or sets a secret;
# tests/test_118_trip_is_the_registered_command.py refuses those tokens in
# this file.
#
# **Why four fires per window.** GitHub's cron is late, not absent:
# heartbeat.yml's header records a 245-minute maximum gap on a */15
# schedule. Four cron minutes inside a 55-minute window is the cheapest way
# to make at least one land; the runs are GETs, so extra ones cost nothing
# but an artifact.
#
# **Which trip a cron fire takes is decided by the cron string that fired
# it** (`github.event.schedule`), not by the runner's clock at the moment it
# finally starts. A T1 fire delayed past 10:00Z still runs the T1 read and
# stamps it; the stamp, not the intent, is what the registration reads.
#
# Required repository secret: FLY_API_TOKEN (already set -- deploy.yml uses
# it). Whether that token can open an ssh console from a runner was
# unverified until this workflow's first dispatch on 2026-09-22.

name: Measure 118

on:
  schedule:
    # T1: 2026-09-23 09:00-09:55Z. Four fires, the last with eight minutes
    # of slack before the window closes.
    - cron: "2,17,32,47 9 23 9 *"
    # T2 + T3: 2026-09-23 10:30-14:00Z, after the budget day rolled.
    - cron: "35,50 10 23 9 *"
  workflow_dispatch:
    inputs:
      trip:
        description: "Which trip to rehearse (t1 = /api/scout; t2 = the three QueryDefs)"
        required: true
        default: t1
        type: choice
        options: [t1, t2]

permissions:
  contents: read

jobs:
  read:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.trip || github.event.schedule }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Decide the trip
        id: trip
        env:
          EVENT: ${{ github.event_name }}
          DISPATCH_TRIP: ${{ inputs.trip }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            trip="$DISPATCH_TRIP"
          else
            case "$SCHEDULE" in
              *" 9 23 9 "*)  trip=t1 ;;
              *" 10 23 9 "*) trip=t2 ;;
              *) echo "unrecognised schedule '$SCHEDULE'" >&2; exit 1 ;;
            esac
          fi
          echo "trip=$trip" >> "$GITHUB_OUTPUT"
          echo "trip=$trip (event=$EVENT schedule='$SCHEDULE')"

      - name: Take the reading
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          TRIP: ${{ steps.trip.outputs.trip }}
        run: |
          # tee keeps the whole transcript for the artifact whatever the
          # script's exit; the exit code is re-raised so a failed read is a
          # red run, which is the signal the next fire is the one that counts.
          set -o pipefail
          sh scripts/measure_118_trip.sh "$TRIP" 2>&1 | tee "118-${TRIP}.txt"

      - name: Summary
        if: always()
        env:
          TRIP: ${{ steps.trip.outputs.trip }}
        run: |
          f="118-${TRIP}.txt"
          {
            echo "## #118 ${TRIP} read, run ${{ github.run_id }}"
            echo
            echo '```'
            grep -E '^(STAMP|BEGIN|END|RESULT)' "$f" 2>/dev/null || echo "(no transcript)"
            echo '```'
            if [ "$TRIP" = "t1" ]; then
              echo
              echo "spend fields, verbatim:"
              echo
              echo '```'
              grep -o '"spend":{[^}]*}' "$f" 2>/dev/null || echo "(no spend object in output)"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 118-${{ steps.trip.outputs.trip }}-${{ github.run_id }}
          path: 118-${{ steps.trip.outputs.trip }}.txt
          if-no-files-found: warn
          retention-days: 30
