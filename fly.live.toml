# Private live instance.
#
#   fly deploy -c fly.live.toml -e GIT_SHA="$(git rev-parse HEAD)"
#
# **Deploy with the -e flag.** It is what makes `/api/health` able to name the
# commit it is running, and establishing that by inference instead cost a
# subagent 32 tool calls of behavioural HTML diffing on 2026-08-17. `-e` sets a
# runtime machine variable, so unlike a Docker build arg it does not invalidate
# a single image layer. Forgetting it is safe rather than misleading: `-e`
# applies only to the deploy that passes it, so the field reports null instead
# of last deploy's commit. Fly's own environment carries no commit at all --
# `FLY_IMAGE_REF` ends in a deployment ULID and `fly releases --json` reports
# `"Metadata": null`. See `backend/config.py`, section "build identity".
#
# Holds real credentials and, eventually, real money. Same image as the demo;
# everything that differs is here.
#
# Secrets are set OUT OF BAND and never appear in this file or the image.
# All FOUR are mandatory -- the instance refuses to start without them, which is
# deliberate: the backend rejects INSTANCE_MODE=live without APP_AUTH_TOKEN,
# because an unauthenticated instance holding real credentials is not an
# acceptable state to boot into.
#
#   fly secrets set -a kalshi-cockpit \
#     KALSHI_API_KEY=... \
#     KALSHI_PRIVATE_KEY_B64="$(base64 -w0 ~/.kalshi/private_key_2.pem)" \
#     ODDS_API_KEY=... \
#     APP_AUTH_TOKEN="$(python -c 'import secrets;print(secrets.token_urlsafe(32))')"
#
# ANTHROPIC_API_KEY and DISCORD_* are optional. This note used to say "the agent
# fleet and the notifier are not wired into the runner, so nothing reads them
# yet". **Both halves are false.** Corrected 2026-08-09 by reading the code; see
# `docs/adr/0018`.
#
#   * The notifier is wired and DISCORD_* is read on **every boot**.
#     `scripts/run_loop.py:360` calls `DiscordConfig.from_env()`, and
#     `run_loop.py:371-373` enters `DiscordNotifier` and hands it to `Alerter`,
#     which runs on every pass. Unset, `from_env` returns None, the loop logs a
#     warning, and nothing reaches a phone.
#   * The fleet is wired. `runner.run_pricing_pass` (backend/runner.py:489)
#     defaults `review=review_surfaced`, and both production callers --
#     `run_once` and `run_quote_pass` -- go through it. The LLM Skeptic runs on
#     every pricing pass.
#
# **The claim that used to live here was refuted by the live table, and the
# refutation is worth more than the claim.** Until 2026-08-21 this block said
# the only thing standing between this deployment and an Anthropic bill was
# `surfaced` having been 0 for the life of the record. `agent_calls` says
# otherwise: on 2026-08-16 the Skeptic made **24 metered Opus calls in 4m22s**
# -- the entire daily cap -- re-reviewing the same four prop rows six times at
# quote-pass cadence. And `surfaced` still read 0 afterwards, because the
# Skeptic blocked all 24: the field is written AFTER the spend it was cited as
# preventing. A zero produced by the thing you are paying for is a receipt,
# not a brake (`tasks/lessons.md`, 2026-08-21).
#
# Since ADR 0062 the pricing pass defaults to `review_retired`
# (backend/agents/review.py): every surfaced row is refused as unreviewed and
# **no Anthropic call is made from the scheduled path at all**. The key stays
# set because the scout desk uses it; the desk is metered separately by
# AGENT_MAX_CALLS_* below. Keep the spend limit on the Anthropic account
# regardless -- config in this file has been wrong about this bill once.
#
# The Kalshi RSA private key is a file rather than a string, so it travels as
# KALSHI_PRIVATE_KEY_B64 and `docker/entrypoint.sh` decodes it into /dev/shm --
# tmpfs, RAM only. Never baked into the image, and deliberately NOT on the
# volume below, where a snapshot would carry it forever.

app = "kalshi-cockpit"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[env]
  INSTANCE_MODE = "live"
  DB_PATH = "/data/cockpit.db"
  PORT = "3000"
  API_ORIGIN = "http://127.0.0.1:8000"

  # **The host every Discord embed deep-links to, and it was never set.**
  # Unset, `AppConfig.load` fell through to `http://localhost:3000`, so alerts
  # arriving on a phone carried a link resolving to the phone itself. The alert
  # looked right and the tap went nowhere, which reads as Discord being broken
  # rather than as a missing variable -- the same shape as the risk caps
  # `fly.demo.toml` omitted, and the reason a value nobody chose is not a value.
  #
  # `backend/config.py` now REFUSES TO BOOT on live if this is loopback or
  # absent, exactly as it does for APP_AUTH_TOKEN. Both refusals are exercised
  # by `tests/test_deployed_urls_are_explicit.py`; the APP_AUTH_TOKEN one had
  # never been watched to fail until that file was written.
  #
  # Second consumer, named here because it is not a no-op: `routes.py:400`
  # passes this to CORS `allow_origins` with `allow_credentials=True`. Live has
  # been allow-listing `http://localhost:3000`. Inert in practice -- the browser
  # reaches `/api/*` same-origin through the Next rewrite, so no preflight fires
  # -- and this change is a tightening, not a loosening.
  COCKPIT_BASE_URL = "https://kalshi-cockpit.fly.dev"

  # The hour the day's parlay card is pushed. 20:00Z is 4pm Eastern, which is
  # what Joe chose (ADR 0076): the MLB and WNBA slates are set and nothing has
  # started. Set here explicitly rather than left to the code default, for
  # `ODDS_MARKETS`' reason -- a value the owner chose should be visible in the
  # deploy file, not inferred from a default somebody may change.
  #
  # **This is 4pm Eastern only while EDT is in force.** From the first Sunday in
  # November the same value lands at 3pm Eastern; changing THIS is the fix, and
  # a timezone is not.
  PARLAY_CARD_UTC_HOUR = "20"

  # The gate stays LOCKED until the paper record earns it: >=300 scored
  # recommendations, positive CLV surviving the noise guard, and every fill
  # matching its predicted fee.
  #
  # **This flag is not the binding limit, and calling it one was wrong.** Until
  # 2026-08-11 the line above read "flipping this to true is the one change that
  # turns a measurement tool into a way to lose money". It is not one change:
  # `ORDERS_ARE_DRY_RUNS` is a hardcoded `True` at `backend/store/orders.py:129`,
  # so the order path stays dry-run whatever this variable says, and
  # `backend/gate.py:729-737` already says exactly that in BOTH branches of its
  # own detail string. The deploy file was stale relative to the gate.
  #
  # The error direction was safe -- it overstated this flag's reach -- but a
  # future session reading only this file would believe one secret arms the
  # system, and would then be surprised twice: once when flipping it moves no
  # money, and once when a code change does. Arming is TWO deliberate acts: this
  # flag, and a code change to that constant. ADR 0018.
  LIVE_TRADING_ENABLED = "false"
  # The manual (hand-bet) door, ADR 0063. Stated explicitly because a default
  # is a decision nobody made. Turning it on exposes POST /api/manual-orders.
  #
  # This comment read "(still dry-run: MANUAL_ORDERS_ARE_DRY_RUNS is a code
  # constant)" until 2026-09-01, and that has been FALSE since 2026-08-26:
  # MANUAL_ORDERS_ARE_DRY_RUNS is False and this route sends real
  # immediate-or-cancel orders. Someone checking the deploy file for whether
  # the hand-bet door spends money got the wrong answer for six days.
  #
  # ON since 2026-08-26, and it spends nothing. The door had been built,
  # tested and unreachable: with the flag false every response is "blocked",
  # so the ticket UI had NEVER RENDERED on live and no part of it had been
  # exercised against a real quote, a real book or a real balance. The
  # second act -- flipping MANUAL_ORDERS_ARE_DRY_RUNS in code -- is what
  # sends an order, and it has not happened. This is the flag whose whole
  # purpose ADR 0018 states out loud: turning it on moves no money.
  MANUAL_ORDERS_ENABLED = "true"
  LIVE_GATE_MIN_SCORED_RECOMMENDATIONS = "300"

  # 20K tier, 20,000 credits/month (2026-08-09). A sweep costs markets x
  # regions -- since 2026-08-16 that is 1 x 2 = **2** (`h2h` only; the "= 6"
  # this line carried until 2026-08-21 described the retired three-market
  # fetch, contradicting the ODDS_MARKETS note further down this same file).
  #
  # 600/day (raised from 400; the paragraphs below argued about 400 and the
  # arithmetic in them is per-sweep, so it survives the raise). Briefly set to 16 on 2026-08-09 and reverted the same day, because
  # on a flat-fee plan the cap saves nothing: **the scheduler, not the budget,
  # decides what gets spent.**
  #
  # The original justification for 400 was wrong even though the number is
  # right. It read "MIN_SLOT_SEPARATION_MS gives each sport at most 12 useful
  # slots a day, so six leagues cannot exceed ~432/day". True and irrelevant:
  # the real bound is how many kickoff *clusters* a slate has, which is three
  # per sport. A full August slate plans **six** sweeps -- 36 credits, not 400.
  #
  # So the cap is ~11x above what the schedule can spend, and lowering it only
  # starts biting well below that. Measured, not argued
  # (`scripts/measure_slot_coverage.py --date 20260809`, free):
  #
  #     2 sweeps/day  ->  16 of 19 games      (~360 credits/month)
  #     6 sweeps/day  ->  18 of 19 games    (~1,100 credits/month, 5.6% of plan)
  #
  # Both sit far inside the 20,000/month plan, so the only thing 16 bought was
  # two fewer games a day and a blocked backfill.
  #
  # **This number's real job used to be bounding a caller that spends faster
  # than a sweep**, and that is no longer the whole of it. The historical
  # endpoints cost 10x per call, so a backfill loop can burn the month between
  # two daily resets -- that is what the daily cap is for, alongside
  # ODDS_MONTHLY_CREDIT_BUDGET below.
  #
  # It said "it is not a cost control on the live loop, which cannot reach it".
  # **That stopped being true well before 2026-08-16, and props are why.**
  # Measured on this instance on the 2026-08-16 budget day, one 13-game MLB
  # cluster:
  #
  #     /sports/baseball_mlb/odds                  1 call     6 credits
  #     /sports/baseball_mlb/events/<13 fixtures>  13 calls  260 credits
  #                                                          266 total
  #
  # The rolling refresh (`docs/adr/0030`) adds 6 credits per 10 minutes.
  #
  # **The +36 figure that stood here was 2x low, and the error is instructive.**
  # It priced ONE 60-minute window: 6 calls x 6 credits. Measured on this
  # instance for the 2026-08-16 budget day, the tail was **12 calls / 72
  # credits**, running 17:16Z to 19:19Z -- **123 minutes**, not 60.
  #
  # The reason is that `DUE_WINDOW_MS` bounds a *slot*, not the evening. On a
  # rolling slate the next cluster's slot is already due before the previous
  # one's closes (19:11Z and 19:41Z kickoffs both had windows open this
  # evening), so the refresh runs continuously for as long as *some* slot is
  # due. On a full slate that is most of the night: **~36 credits an hour, for
  # as long as games keep starting.**
  #
  # So the measured day was **338 = 266 opening + 72 refresh**, one cluster.
  # Budget accordingly: a five-hour evening of refresh alone is ~180 credits
  # before a single opening call.
  #
  # This is the same shape as the note four paragraphs down -- a cost model that
  # prices one call but not the call it triggers. Here it priced one window but
  # not the window that opens behind it.
  #
  # Props were still the larger line item on that day (260 of 338, 77%), and
  # they are now off by default -- see ODDS_BUY_PROPS_ON_SCHEDULE below. With
  # them off, **the refresh becomes the whole bill**, so this number stops being
  # a footnote and starts being the budget.
  #
  # At 600 that is 2 clusters a day. It was also 2 at the old one-buy-per-cluster
  # cost; what bought the second one is raising this from 400, not the refresh.
  # If more clusters a day are wanted, the lever is `prop_market_keys()` and
  # whether that ladder is earning -- nothing in the odds schedule.
  #
  # **Do not restate a cost here that has not been reconciled against
  # `api_credits`.** The line above this one previously claimed 42 credits a
  # cluster and 14 clusters a day, inferred from this file carrying no `PROP`
  # variable. Props come from code defaults, not the environment; an absent
  # variable means the default applies, not that the feature is off.
  #
  # **The interaction with the monthly cap, stated because it is not obvious.**
  # 600 x 31 = 18,600, which exceeds ODDS_MONTHLY_CREDIT_BUDGET of 13,000. The
  # daily cap therefore no longer bounds the month by arithmetic. That is fine
  # and is why the monthly cap exists as a separate guard -- expected spend
  # (~5,000-7,500/month) sits well inside it -- but if the daily ceiling is ever
  # actually reached for three weeks running, the month runs out around day 21
  # and every sweep stops. `api_credits` is where that would show first.
  #
  # An earlier note here claimed 16/day "cost" stale_odds on 256 of 265 rows.
  # That does not survive `docs/adr/0014`: most of those passes had no window
  # because the slate had no games, not because the budget was small.
  #
  # **Unmeasured:** August is two leagues. Re-run the coverage script on a
  # winter slate once the NBA schedule is published -- and re-run it at all,
  # because it was measured against one-buy-per-cluster.
  #
  # Raised 600 -> 700 on 2026-08-23 with ODDS_MARKETS = "h2h,spreads" (ADR
  # 0070): the desk window alone is now 576/day, and a 600 cap would have let
  # one kickoff-slot sweep or odds refresh stop every sport for the day. The
  # arithmetic and the four-sport warning live beside ODDS_DESK_WINDOW_UTC.
  ODDS_DAILY_CREDIT_BUDGET = "700"

  # Our own monthly ceiling, below the plan's 20,000. The daily cap bounds a
  # month only if you multiply it out, and it cannot bound a caller that spends
  # 10x per call -- which the historical endpoints do. The gap to 20,000 is
  # deliberate headroom for that work.
  #
  # Raised 13,000 -> 18,000 on 2026-08-23 (ADR 0070): spreads doubled the
  # sweep and the desk window's expected month (~17,300) no longer fit. Still
  # inside the paid 20,000; the headroom for historical pulls narrowed to
  # ~2,000 -- a deliberate trade, recorded beside ODDS_DESK_WINDOW_UTC.
  ODDS_MONTHLY_CREDIT_BUDGET = "18000"

  # The desk window (2026-08-23): re-buy every fixtured sport on the 10-min
  # refresh cadence 16:00Z-04:00Z (9am-9pm PT -- the hours Joe actually looks,
  # his answer 2026-08-23), so the slate is priced while the desk is open
  # rather than only in the hour before a kickoff cluster. Measured before
  # this: 63 of 71 slate rows `stale_odds` (median odds age 13.7h) with 0 of
  # 600 daily credits spent.
  #
  # **Re-done 2026-08-23 for `ODDS_MARKETS = "h2h,spreads"` (ADR 0070), which
  # doubled a sweep from 2 credits to 4.** The window is now 2 sports x
  # 4 credits x 12h x 6/hour = **576/day, ~17,300/month**. That broke the old
  # 13,000 monthly self-cap on paper around day 22, so the caps below were
  # raised the same day: monthly 13,000 -> 18,000 (the paid tier is 20,000 --
  # line ~123 -- so this stays inside what the $30/mo already buys, with
  # ~2,000 left for prop refreshes at 26 each), daily 600 -> 700 (a burst
  # brake; 700 x 31 > 18,000, so the monthly cap still binds first in a
  # saturated month -- the same deliberate shape the old 600/13,000 pair had).
  # **At four sports (NCAAF+NFL) this window is 1,152/day, ~34,600/month,
  # which BREAKS even the 20,000 plan** -- when those sports enter scope,
  # narrow this window, drop spreads off-season, or change the tier,
  # deliberately, in this file. See `.env.example` and `odds/timing.py:DESK`.
  #
  # **UNSET 2026-08-25. That decision came due and this is it** (ADR 0071
  # section 2.6). NCAAF was predicted to enter scope ~2026-08-25, and the
  # options above were narrow-the-window, drop-spreads, or pay more. Joe chose a
  # fourth: the feed follows attention instead of a clock, over a slow floor.
  #
  #   attended, someone with the page open   the 10-minute refresh cadence
  #   nobody looking                         hourly, per sport with a fixture
  #                                          inside 12 hours
  #
  # Empty rather than deleted. The setting still works and `desk_wants` still
  # reads it -- an operator can pin a window back on without a code change --
  # but leaving a value here would keep buying every ten minutes all evening
  # regardless of attention, which is the bill this change exists to cut.
  #
  # **What replaces the arithmetic above is a ceiling, not an estimate.** Every
  # "attended hours" figure anyone can offer is a guess about how long the page
  # is actually open, and this file is not the place to record a guess as a
  # number. What is knowable:
  #
  #   idle floor only, 4 sports          ~384/day    24h x 4 sports x 4 credits
  #   attention, capped                  <=300/day   ODDS_ATTENTION_DAILY_CREDITS
  #   worst case                         ~684/day    inside the 700 daily cap
  #
  # The old window's 576/day was a floor on spend; this is a ceiling on it. The
  # actual figure is measured, not predicted: `api_credits` summed per
  # budget-day by `trigger` separates attention from the floor from the
  # schedule. Read it a few days after this deploys before believing any saving.
  ODDS_DESK_WINDOW_UTC = ""

  # The hard ceiling on attention-triggered spend, and the reason the change
  # above is safe (ADR 0071 section 2.6, Joe's answer 2026-08-25).
  #
  # The new design's WORST case is worse than the one it replaces: one tab left
  # open and visible for 24h is 1,152 credits/day at two sports and 2,304 at
  # four -- double the fixed window, past the whole 20,000/month tier. The
  # `document.visibilityState` check in `Nav.tsx` is what should prevent that;
  # this is what does. A guard a browser bug can defeat must not be the only
  # thing between a design and its worst case.
  #
  # 300 of the 700 daily budget. Past it the desk stops re-buying at the
  # attended cadence and **keeps its hourly floor**, so the slate never goes
  # dark -- which is what makes a cap this low safe. Read
  # `ondemand.DEFAULT_MANUAL_DAILY_CREDITS`'s comment before changing it: a
  # slice is sized against what the schedule can lose without a kickoff cluster
  # going dark, and if it binds routinely the answer is a change of design, not
  # a bigger slice.
  ODDS_ATTENTION_DAILY_CREDITS = "300"

  # Ceilings on Anthropic spend, enforced by `backend/agents/budget.py`.
  #
  # **This instance is the one that had no ceiling.** `ANTHROPIC_API_KEY` is set
  # here (`/api/health` reports `agent_fleet_configured: true`) and until
  # 2026-08-24 `AGENT_MODEL` was not, so the live model was `agents/base.py`'s
  # default -- claude-opus-5, the expensive one, billing unnoticed for exactly
  # the reason the paragraph below gives about inferring a deployed value from a
  # default two files away. It is set explicitly now (ADR 0071 section 2.7).
  # Before 2026-08-11 the Skeptic fanned out over every surfaced
  # row with no cap, on a full pass every RUNNER_INTERVAL_S and a quote pass
  # every RUNNER_FAST_INTERVAL_S. The bill was held at zero by `surfaced == 0`,
  # which is a measurement outcome and not a configuration value.
  #
  # Stated explicitly here even though they equal the code defaults, because the
  # deployed value of a money cap should be readable in the deploy file rather
  # than inferred from a default two files away -- that inference is how the
  # missing AGENT_MODEL above ends up billing at the Opus rate unnoticed.
  #
  # **The count is the guarantee: 24 calls a day is 24 HTTP requests a day.**
  # `build_client` passes `max_retries=0`, so one candidate is exactly one
  # request. That sentence holds whatever a call turns out to cost, and it is
  # the one to rely on. (Before 2026-08-11 it did not: the SDK default of two
  # retries meant 24 counted calls permitted up to 72 billed requests.)
  #
  # In dollars, **conditional on a rate this repo cannot verify**: the
  # claude-opus-5 list price of $5 / $25 per million is [ASSUMED, uncited] --
  # see `backend/agents/base.py`, which carries the derivation. On that
  # assumption a call is ~1,730 input and up to 3,000 output (`max_tokens=3000`
  # with adaptive thinking billed as output), i.e. **$0.014-$0.084 a call**, so
  # a saturated day of 24 is **$0.35-$2.01** and a saturated month ~$10-$60.
  #
  # Quote the range or quote the count, not a point estimate. The figure that
  # used to sit here -- "~4.5c a call, ~$1.10 a day" -- was a point estimate on
  # an uncited rate, and it was low by ~1.9x even before the missing retries.
  #
  # AGENT_MAX_CALLS_PER_PASS is not a second money control: it and
  # AGENT_MAX_CALLS_PER_DAY live in the same `min()` in `agents/budget.py`, so
  # the day is 24 for any per-pass value in [1, 24]. What the per-pass cap
  # controls is fan-out width -- how the day's 24 are spread over the day's
  # passes rather than spent in the first one.
  #
  # **AGENT_MAX_CALLS_PER_DAY is NOT the binding control either, and this
  # comment claimed it was until 2026-08-24** (ADR 0071 section 2.7). A
  # scout-desk convening reserves against `STAFF_PAIR_SEARCHES_WORST_CASE = 12`
  # (`agents/scout_desk.py:70`) before it reserves calls, so
  # AGENT_MAX_SEARCHES_PER_DAY = 60 allows **5 convenings a day** while
  # AGENT_MAX_CALLS_PER_DAY = 24 allows 6. The search cap binds first, one
  # convening earlier, and raising the call cap alone would buy nothing.
  #
  # Raise deliberately, after the first real bill -- `skeptic_unreviewed` in the
  # pass log counts the rows a ceiling refused, and `AgentBudget.today_summary`
  # reports how much of today's 24 is gone.
  AGENT_MAX_CALLS_PER_PASS = "8"
  AGENT_MAX_CALLS_PER_DAY = "24"

  # **The desk runs on Sonnet, not Opus** (ADR 0071 section 2.7, Joe's call
  # 2026-08-24). Set explicitly rather than left to `agents/base.py`'s
  # DEFAULT_MODEL, because an unset money-bearing value is how this instance
  # spent at the Opus rate without anyone choosing to.
  #
  # The reasoning, so a future session can overturn it on the argument rather
  # than the preference: every seat at the desk -- scout, staff pair, master,
  # and Willy's -- reads web-search results that arrived seconds earlier and
  # writes a structured summary of them. That is synthesis of supplied text,
  # which is the shape where a cheaper model gives up least; it is not
  # reasoning from scratch, where it would give up most.
  #
  # **Promote a seat, not the desk**, if one proves to need the horsepower.
  # `structured_call` takes `model` per call (`agents/base.py:347`), so a single
  # seat can be raised without moving the other three, and the meter records
  # usage per call either way.
  AGENT_MODEL = "claude-sonnet-5"

  # The token meter's daily brakes (v17): the call caps cannot see the up-to-12
  # web searches a scout-desk convening can spend, nor the search results it
  # bills as input tokens. Evaluated over recorded usage BEFORE the next
  # reserve -- a brake, not a receipt. See .env.example for the arithmetic.
  AGENT_MAX_SEARCHES_PER_DAY = "60"
  AGENT_MAX_TOKENS_PER_DAY = "500000"

  ODDS_REGIONS = "us,eu"

  # **CORRECTED 2026-08-23 (ADR 0070): spreads are back, deliberately.**
  # The block below was written 2026-08-16 and its "nor could they be used"
  # paragraph is now false in exactly the way it anticipated: the parlay
  # desk's spread pricing path exists (`runner._price_spread_event`, writing
  # `fair_prices` only, never `recommendations`), and `linker.py`'s 2-side
  # refusal no longer applies to spread events -- they inherit their game's
  # link by fixture segment (`SPREAD_LINK_METHOD`), the prop mechanism one
  # market along. `totals` stay off: no consumer, same as before. The rest
  # of the 2026-08-16 block is kept because its history is load-bearing --
  # the collision arithmetic below just changes coefficient (see the desk
  # window note above for the new numbers).
  #
  # **`h2h` only, and this is a 3x cost cut that loses nothing.** Changed
  # 2026-08-16 from `h2h,spreads,totals`.
  #
  # A team sweep costs `len(markets) * len(regions)` -- `odds/budget.py:66-68`
  # -- so three keys across two regions was 6 credits per sport per refresh.
  # **Two of those three keys were consumed by nothing.** The pricing path is
  # `book_quotes_for_event(conn, odds_event_id, *, now, market=MONEYLINE)` with
  # `MONEYLINE = "h2h"` (`runner.py:136, 252`), and its ONLY call site
  # (`runner.py:1218`) passes no `market` and therefore takes the default.
  # Outside tests, `"spreads"` and `"totals"` appear in exactly one place in the
  # tree: `TEAM_MARKETS` in `odds/client.py:95`, which is the *fetch* allowlist.
  # No suppression rule, devig, EV computation, sizing calculation, gate
  # condition or API response reads either one.
  #
  # **Nor could they be used if something wanted to.** `match/linker.py:281`
  # refuses any Kalshi event whose side-set is not exactly 2, so KXNFLSPREAD
  # (25 sides), KXNFLTOTAL (19) and KXMLBTOTAL (11) are rejected on every pass
  # and always have been. Spread and total have never priced for ANY sport.
  # Buying their odds is buying the input to a feature that does not exist.
  #
  # **What it buys back.** 6 credits/call -> 2. The measured collision was an
  # NCAAF Saturday (12.5 open hours) landing on an MLB evening: 630-700 credits
  # against this file's 600 daily cap. When the cap binds, `decide_sweeps`
  # returns `remaining == 0` and **every sport stops** (`timing.py:1023-1033`),
  # so NCAAF would have spent the day and taken MLB's evening down with it --
  # and MLB is the population the CLV record is accumulated on. At 2 credits
  # that collision is 210-233 and fits with room.
  #
  # **What it costs, stated because it is not zero and is not recoverable.**
  # Spread/total odds history stops accumulating in `odds_snapshots`. Re-enabling
  # is this one line; the days in between cannot be bought back. Accepted
  # deliberately: it is history for a feature that would need `linker.py:281`
  # rewritten first, and that is a separate decision with its own ADR.
  #
  # `docs/measurements/2026-08-16-nfl-ncaaf-scope-and-cost.md`.
  ODDS_MARKETS = "h2h,spreads"

  # **Scheduled prop buying, and it is OFF.** ADR 0032.
  #
  # This equals the code default (`OddsConfig.buy_props_on_schedule`), and is
  # stated here anyway because it is a money switch and the deploy file is where
  # a money switch should be readable. The previous line above this one is the
  # reason: props came from a code default with no environment variable, the
  # absence was read as the feature being off, and it meant the default applied
  # -- 260 credits a cluster nobody had budgeted. An explicit `false` cannot be
  # misread in either direction.
  #
  # What it saves and what it costs, both measured rather than argued:
  #
  #   on   6 + 20x13 = 266 opening, ~302 with the refresh tail  -> 2 clusters/day
  #   off  6 + ~36 refresh tail    = ~42                        -> ~14 clusters/day
  #
  # **Both rows are pre-2026-08-27 arithmetic and the `on` row has halved
  # since.** The `_alternate` prop keys are no longer bought (they carried no
  # Under on 35,448 of 35,448 rungs and contributed 0 of 3,940 usable
  # consensus lines), so a prop event is 10 credits, not 20: the `on` row is
  # now `4 + 10x13 = 134` opening. The rows are kept as written because ADR
  # 0032's decision was taken against them.
  #
  # **This does NOT re-open the decision.** ADR 0032's annotation says
  # scheduled props are "explicitly killed, not deferred", and a halved price
  # is not by itself a reason -- see the parlay-desk work, which is the first
  # consumer of a prop row that is not the gate.
  #
  # The 86% of the bill this removes bought **no cluster** toward the 300-game
  # floor. `gate.clustered_clv` keys on `event_links.odds_event_id` and
  # `gate.py:424-428` states that a prop event inherits its game's fixture id by
  # construction, so a prop row on a game that already has a moneyline row is
  # not an independent observation and never was one. Games are the binding
  # constraint on the gate; props were consuming the budget that buys them.
  #
  # **Props are not gone.** `POST /api/odds/refresh` buys one fixture's ladder
  # for 14 credits (ADR 0031; the figure read 26 until 2026-08-24 and 24 until
  # 2026-08-27 -- first from before `ODDS_MARKETS` gained `spreads` (ADR 0071
  # section 4), then from before the `_alternate` keys came off), which is where the
  # expensive purchase now lives:
  # bought for a game somebody is looking at, rather than for all thirteen in
  # advance. Turning this back on is a deliberate act, not a default.
  #
  # **Unmeasured, and it is the one thing that would argue against this:** a game
  # whose *only* priced row is a prop would contribute a cluster the moneyline
  # did not. On the six fixtures observed on 2026-08-15 that never happened --
  # every prop event sat on a game that already had rows -- but n is six.
  # `clv-coverage` section A would settle it.
  ODDS_BUY_PROPS_ON_SCHEDULE = "false"

  # An opportunity outside either bound is not bettable, enforced server-side.
  MAX_ODDS_AGE_S = "900"
  MAX_KALSHI_QUOTE_AGE_S = "30"

  # This does NOT change what the evidence record counts. The gate's
  # `actionable` counter is scored against a reference bankroll fixed in code
  # (`config.REFERENCE_*`), for the reason in `docs/adr/0015`: defining it here
  # let the size of the deposit decide what counted as evidence, and at $100 it
  # closed the 50c band this strategy trades, leaving only the far wings.
  #
  # BANKROLL_DOLLARS, MAX_POSITION_DOLLARS, MAX_EXPOSURE_DOLLARS and
  # MAX_DAILY_LOSS_DOLLARS are RETIRED (ADR 0045). The four dollar quantities
  # are derived at each sizing decision from the venue's own balance record
  # (`venue_balance_snapshots`, polled every 5 minutes), at the same fractions
  # this file used to state: 10% in one market, 40% at risk at once, 10% lost
  # in a day. The typed "100" here sat against a real ~$20.66 for a week --
  # every Board size ~4.8x inflated -- and nothing was red. Setting any of the
  # four again is announced at ERROR on every config load and on /api/health,
  # and is never read.
  KELLY_FRACTION = "0.25"

  # `MIN_ORDER_CONTRACTS` is deliberately absent. If it is ever set,
  # `RiskConfig.load` logs an ERROR on every load and the name appears in
  # `retired_settings_set` on `/api/health` -- it **announces, and enforces
  # nothing**. It must stay that way: raising here runs inside `create_app`,
  # which uvicorn runs at boot, which `entrypoint.sh` supervises with `wait -n`.
  # That is a crash loop landing *after* the volume has migrated, so an image
  # rollback would not recover it either -- only `flyctl secrets unset` would,
  # and flyctl is a laptop job while this tool is operated from a phone.
  # Nothing replaced the setting, and nothing needed to: the
  # sizer already prices every candidate at the fee a SINGLE contract would pay,
  # which is the most expensive per-contract fee any size pays, so a positive
  # Kelly fraction already implies the order is +EV at whatever size it
  # produces. At this bankroll the constant closed the 50c band entirely and
  # left only the far wings, where an edge is least believable. See ADR 0015.

  # Unset until 2026-08-17, so both instances ran on the code default. Written
  # out at the value it already had: this changes no behaviour, it removes an
  # inheritance. Every other cap on this instance was stated and this one was
  # not, which is the same gap -- one file short -- that left the whole set
  # missing from `fly.demo.toml`. A cap nobody chose is not a cap.
  MAX_ORDER_CONTRACTS = "50"

# SQLite and the Parquet lake live here. This is why the app cannot be
# serverless: it needs a disk and a process that stays up to hold the
# WebSocket.
[mounts]
  source = "cockpit_data"
  destination = "/data"

  # Auto-extend, added during the 2026-08-16 volume-full incident.
  #
  # The volume was created at 1GB and the record grows monotonically, so this
  # was always going to happen -- the only question was when, and the answer
  # turned out to be mid-slate with no warning. `cockpit.db` reached 879 MiB of
  # a 974 MiB volume, `freelist_count` was 0 (so a VACUUM would reclaim
  # nothing), the migration died on its first write, and the machine crash
  # looped until Fly hit its restart cap.
  #
  # **Extending is the non-destructive fix and that is why it is first.** The
  # alternative -- deleting rows to make room -- is irreversible, and two thirds
  # of the file is `kalshi_quotes`, which IS the record. Buying disk costs about
  # 15 cents per GB per month. Deleting the wrong rows costs the measurement.
  #
  # The threshold is 80% rather than 90% because SQLite needs headroom it does
  # not appear to be using: a write extends the WAL first, and `VACUUM` needs
  # roughly the whole file free on the same filesystem. A volume that only
  # extends at 90% can still be unable to run the repair.
  #
  # **RESOLVED 2026-09-01: the volume is 10GB and the limit is 20GB.** The
  # paragraph below describes the state that ended that day and is kept
  # because the trap in it recurs — a limit equal to the volume's own size is
  # a net that cannot fire, and it reads exactly like a net that can.
  #
  # The limit is a real ceiling, not a formality — AND IT HAD BEEN REACHED,
  # by the wrong route. The volume was extended to 5GB manually on
  # 2026-08-16 (ADR 0054's own extend), not by unbounded growth, so the
  # tripwire this comment used to describe ("reaching 5GB means something
  # is growing without a retention rule") fired without its condition being
  # true. What matters is that **the auto-extend net cannot fire again.**
  # Any further growth ends in ENOSPC — a hard down that a restart does not
  # clear — and recovery is a manual `fly volumes extend` from a laptop.
  #
  # **"measured growth 0 B/day with retention deployed" (recorded 2026-08-20)
  # was here until 2026-09-01 and is wrong by the whole quantity.** Measured
  # on the live box that day by differencing `db_kb`, which nothing had ever
  # differenced before: **161.40 MB/day against 2,592,702,464 bytes actually
  # free**, which fills the volume about 2026-09-17. See
  # `docs/measurements/2026-09-01-the-volume-clock.md` — and read its n = 1
  # day caveat, it is not a footnote.
  #
  # The zero was reproducible rather than a slip, which is the part worth
  # keeping: **the file does not grow for about twenty hours a day.** It is
  # byte-identical across 574 consecutive samples spanning 21.51 hours, and
  # four hours of in-play carry 99.51% of a day's growth. So any window
  # shorter than a full day reads 0 B/day no matter what the daily rate is.
  # A growth measurement on this database must span >= 24 h or it measures
  # the quiet part.
  #
  # If usage climbs again, first ask what lost its retention rule; raise
  # the number only with the answer in hand. Today the answer is known:
  # `fair_prices` is 646 MB and has no retention rule.
  # **Raised 5GB -> 20GB on 2026-09-01, and the ceiling is the whole point of
  # the edit.** Joe extended the volume 5GB -> 10GB by hand the same day, on
  # the measured 161.40 MB/day fill date of ~2026-09-17. Extending ALONE would
  # have left this at 5GB — below the volume's own new size — so the net would
  # still have been unable to fire, which is exactly the state that let the
  # 2026-09-17 clock run unnoticed for twelve days. A limit under the current
  # size is a disabled net that reads like a configured one.
  #
  # 20GB is a backstop, not a plan: at the measured rate the 10GB volume runs
  # to roughly mid-November, and the retention downsample is the thing that
  # should actually bound growth. The net exists so that a miss costs money
  # rather than an outage — about 15 cents per GB per month, against an ENOSPC
  # a restart does not clear.
  #
  # Threshold stays 80 rather than 90 for the reason recorded above: SQLite
  # extends the WAL before a write, and this record has seen a 175 MiB WAL
  # during an in-play burst. A volume that only extends at 90% can be unable
  # to run its own repair.
  auto_extend_size_threshold = 80
  auto_extend_size_increment = "1GB"
  auto_extend_size_limit = "20GB"

[http_service]
  internal_port = 3000
  force_https = true
  # NEVER scale to zero. Stopping the machine drops the Kalshi WebSocket, and
  # a reconnect after an outage re-snapshots every book. More importantly, a
  # stopped machine records no closing lines -- and an unrecorded close is an
  # observation lost forever, since candlesticks age out.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 50

[[vm]]
  # **Two shared vCPUs since 2026-08-31, and the reason is a measurement rather
  # than a hunch.** On one shared vCPU a QUOTE pass took **75.0 seconds against
  # a 15-second cadence**, so the recorder never stopped running -- and it
  # shares that single core with the Python API and with Next's SSR. The API
  # queued behind it: `/api/slate` took 30s and then 500'd (`Failed to proxy
  # ... socket hang up, ECONNRESET` at the Next proxy) while `/api/bets`
  # answered in 324ms, and `flyctl ssh` hung twice on the same box.
  #
  # The scheduler had been saying so in its own words: *"a QUOTE pass took
  # 75.0s; with a 15s fast interval and 15% jitter the worst-case gap between
  # confirmations is 92.3s, past the 30s Kalshi quote limit."*
  #
  # **What changed is the season, not the code.** That pass discovered 663
  # events and quoted 7,833 markets; `CLAUDE.md` predicted this when NCAAF and
  # NFL came into scope. The work is real, so the honest fix is a box that can
  # do it rather than a record that skips it.
  #
  # **`shared-cpu-2x` and not `performance-1x`, deliberately.** A dedicated
  # core is roughly $31/month against ~$11 here, on an instance whose deployed
  # bankroll is $100 -- disproportionate before two shared cores have been
  # shown to be insufficient. The thing to watch is the same warning line: if
  # a pass still exceeds its cadence at 2x, the workload wants a dedicated
  # core (shared CPU is credit-throttled, and this loop runs continuously
  # rather than in bursts), and THAT is the moment to spend the difference.
  size = "shared-cpu-2x"
  # **2gb because 1gb was measured, not because bigger is safer.** On
  # 2026-08-19 the loop held ~585 MB steady with a ~70 MB spike on every full
  # pass, against 962 MB usable. That left `MemAvailable` at 21-82 MB and the
  # page cache at 27-135 MB -- for a 1546 MB database whose hot index alone is
  # 476 MiB, so under a tenth of the index the pass writes into every fifteen
  # seconds could stay resident.
  #
  # The box did not merely run slowly. It OOM-killed the loop at 18:59:16Z
  # (anon-rss 675,560kB), and twice more stalled it in `D (disk sleep)` on
  # `folio_wait_bit_common` for 12-18 minutes at a stretch -- blocked in the
  # kernel waiting on a page, with the API still answering health checks from a
  # different process the whole time.
  # `docs/measurements/2026-08-19-live-oom-killed-itself.md`.
  #
  # **This buys headroom; it does not fix the growth.** `kalshi_quotes` was
  # growing +6.4M rows/day against a prune whose ceiling is half the write rate
  # (ADR 0055, and the prune ceiling item it explicitly leaves open). A larger
  # index eats a larger cache. If this line ever needs raising again, that is
  # the thing to fix rather than this number.
  memory = "2gb"

[checks.health]
  type = "http"
  port = 3000
  path = "/api/health"
  interval = "15s"
  timeout = "5s"
  # **120s, raised from 40s on 2026-08-30 (ADR 0086), and the reason is a
  # one-off that will not stay one-off.** `docker/entrypoint.sh` runs
  # `scripts/migrate_db.py` BEFORE uvicorn binds this port, so every second a
  # migration takes is a second before the first health check can pass. Schema
  # v31 builds a covering index over `odds_snapshots`, which is 244 MB across
  # 59,665 pages on this volume -- a full table read plus a sort, on a
  # shared-cpu-1x box with 2 GB. It took 3.0s on 266 MB of synthetic rows on a
  # developer laptop; nobody has timed it here, and 40s was not a margin, it
  # was a guess that happened to hold while migrations only added columns.
  #
  # A longer grace period does not hide a dead boot. `set -e` in the entrypoint
  # aborts the container on a failed migration, and Fly notices an exited
  # machine without waiting for a health check at all -- so what this delays is
  # only the verdict on a machine that is still working.
  #
  # Raise it again rather than trimming a migration to fit: the constraint that
  # matters is that the volume holding the record cannot be recreated.
  grace_period = "120s"
