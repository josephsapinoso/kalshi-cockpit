# Public demo instance.
#
#   fly deploy -c fly.demo.toml -e GIT_SHA="$(git rev-parse HEAD)"
#
# **Deploy with the -e flag**, for the reason given at the top of
# `fly.live.toml`: it is what lets `/api/health` name its own commit, and it
# costs the Docker layer cache nothing. Omitting it reports null, never a stale
# SHA.
#
# This is the portfolio link. It runs the same image as the live instance but
# holds NO credentials, reaches NO network, and has NO execution path -- the
# order endpoint returns 403 whenever INSTANCE_MODE=demo.
#
# Deliberately NO [mounts] block. Without a volume the database lives in the
# container filesystem and is regenerated from seed on every boot, which means
# the demo cannot accumulate state and always matches the screenshots. It also
# means there is nothing on this machine worth stealing.

app = "kalshi-cockpit-demo"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[env]
  INSTANCE_MODE = "demo"
  DB_PATH = "/data/demo.db"
  PORT = "3000"
  API_ORIGIN = "http://127.0.0.1:8000"

  # Set for parity and for CORS, and NOT for alerting -- the honest reason
  # matters here. `docker/entrypoint.sh:205-214` starts `scripts/run_loop.py`
  # only when INSTANCE_MODE != "demo", so this instance never constructs a
  # notifier and no Discord embed is ever built from this value. Its only live
  # consumer is `routes.py:400`'s CORS allow-list.
  #
  # Stated anyway, on the same logic as the risk caps below: the live boot
  # refusal in `backend/config.py` does not apply to demo, so an omission here
  # would be silent forever.
  COCKPIT_BASE_URL = "https://kalshi-cockpit-demo.fly.dev"
  # Belt and braces: the gate is already locked by default, and the demo has no
  # credentials to trade with even if it were not.
  LIVE_TRADING_ENABLED = "false"
  # ADR 0063: the demo refuses the manual path on its instance mode regardless
  # of this flag; stated anyway so the decision is visible.
  MANUAL_ORDERS_ENABLED = "false"

  # --- risk caps ------------------------------------------------------------
  #
  # These were absent until 2026-08-17 and the demo fell through to the code
  # defaults in `backend/config.py` -- 1000 / 0.25 / 50 / 100 / 400 / 100, which
  # is TEN TIMES looser than the live instance on every dollar figure. A card
  # here reading `Buy 17` was one contract at the roll actually deployed. See
  # `docs/adr/0040`.
  #
  # They are set even though this instance cannot trade. The demo holds no
  # credentials and `POST /api/orders` returns 403 whenever INSTANCE_MODE=demo,
  # so nothing here bounds any money -- these bound the *sizes on the screen*,
  # and the screen is the entire product on this instance. A public URL that
  # displays a position its operator could not take is the flattering number
  # this project exists to refuse, and it is the one strangers see.
  #
  # **The values match `fly.live.toml` deliberately, and that is a decision
  # rather than a default.** The alternative considered was a rounder demo
  # bankroll -- $1,000 shows a wider spread of position sizes and photographs
  # better, and at $100 most cards read `Buy 1`. That is the case *for* copying
  # live: `Buy 1` is what this system actually produces, and a portfolio piece
  # whose thesis is "the record is the product" cannot open by overstating its
  # own size. The demo is a window onto the deployed system, not a brochure.
  #
  # They are stated separately rather than shared with `fly.live.toml` because
  # Fly gives no include mechanism, and are asserted equal-or-tighter by
  # `tests/test_deployed_risk_caps_are_explicit.py`. Divergence is allowed --
  # divergence upward is not.
  #
  # The four dollar caps are RETIRED here exactly as in `fly.live.toml`
  # (ADR 0045): derived from an observed balance, which the demo does not
  # have -- its Board sizes are seeded by `seed_demo.py` at an explicit
  # profile, and its live sizing paths are absent by design (no credentials,
  # no QuoteHub, orders 403). A typed cap here would be a claim about an
  # account this instance does not hold.
  KELLY_FRACTION = "0.25"
  # Unset here and in `fly.live.toml` until now, so both ran on the code
  # default. Written out at the same value it already had: this changes no
  # behaviour, it removes an inheritance. A cap nobody chose is not a cap.
  MAX_ORDER_CONTRACTS = "50"
[http_service]
  internal_port = 3000
  force_https = true
  # A demo has no users at 3am. Scaling to zero makes it effectively free and
  # the cold start is a few seconds, which is fine for a portfolio link.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 40
    hard_limit = 80

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[checks.health]
  type = "http"
  port = 3000
  path = "/api/health"
  interval = "30s"
  timeout = "5s"
  grace_period = "40s"
